spring.application.name=linkly
# Render injects PORT; fall back to 8080 locally.
server.port=${PORT:8080}
# We resolve the client IP ourselves (see ClientIpResolver). The "framework" strategy
# trusted the left-most X-Forwarded-For value, which any client can forge.
server.forward-headers-strategy=none
server.shutdown=graceful

# ---------------------------------------------------------------------------
# PostgreSQL (Supabase). Use the Supabase *Session pooler* connection string.
# ---------------------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/linkly}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.idle-timeout=300000

# Flyway owns the schema. Hibernate never alters tables at runtime.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.baseline-description=Schema created by Hibernate before Flyway was active
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:none}
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# ---------------------------------------------------------------------------
# Redis (Upstash). Optional: leave REDIS_URL empty to run without Redis.
# Use the rediss:// (TLS) URL from the Upstash console.
# ---------------------------------------------------------------------------
# Read by our own RedisConfig (Spring Boot would refuse to start with an empty spring.data.redis.url).
app.redis.url=${REDIS_URL:}
spring.data.redis.repositories.enabled=false
app.redis.circuit-cooldown=30s

# ---------------------------------------------------------------------------
# Security
# ---------------------------------------------------------------------------
# HMAC secret for JWTs: at least 32 characters. The app refuses to start without it.
jwt.secret=${JWT_SECRET:}
jwt.expiration=${JWT_EXPIRATION_MS:86400000}
# Comma-separated list of browser origins allowed to call the API.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:${FRONTEND_URL:http://localhost:5173}}
# How many reverse proxies sit in front of the app and append to X-Forwarded-For.
# Render = 1. Check "Request IP debug" in the admin System Health panel to verify.
app.trusted-proxy-count=${TRUSTED_PROXY_COUNT:1}
# Admin account is seeded only when ADMIN_PASSWORD is set.
app.admin.username=${ADMIN_USERNAME:admin}
app.admin.email=${ADMIN_EMAIL:admin@linkly.local}
app.admin.password=${ADMIN_PASSWORD:}

# ---------------------------------------------------------------------------
# Links, analytics pipeline and integrations
# ---------------------------------------------------------------------------
app.frontend-url=${FRONTEND_URL:http://localhost:5173}
app.links.max-per-user=200
app.analytics.stream-key=link-clicks-stream
app.analytics.consumer-group=analytics-group
app.analytics.consumer-name=linkly-consumer
app.analytics.stream-max-length=10000
app.analytics.batch-size=100
app.analytics.drain-interval-ms=2000
app.analytics.sweep-interval=5m
app.analytics.max-delivery-attempts=5
app.analytics.local-buffer-capacity=10000
# Secret used to hash visitor IPs before they are stored (falls back to the JWT secret).
app.analytics.ip-hash-salt=${IP_HASH_SALT:${JWT_SECRET:}}
app.geoip.enabled=${GEOIP_ENABLED:true}
app.geoip.url=https://get.geojs.io/v1/ip/geo.json
# Public URL of this backend, used by the optional self-ping. Render sets RENDER_EXTERNAL_URL.
app.keep-alive.url=${SELF_PING_URL:${RENDER_EXTERNAL_URL:}}
app.keep-alive.interval-ms=600000

spring.task.scheduling.pool.size=3

# ---------------------------------------------------------------------------
# Observability. /actuator/health is public but shows no details;
# use /api/admin/system/health (admin only) for the full picture.
# ---------------------------------------------------------------------------
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
# Redis is optional, so it must never make the app report itself as DOWN.
management.health.redis.enabled=false

springdoc.swagger-ui.persist-authorization=true
