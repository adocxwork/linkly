spring.application.name=linkly

# PostgreSQL Database Configuration
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/linkly}
spring.datasource.username=${DB_USERNAME:adityagupta}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate Configuration
spring.jpa.hibernate.ddl-auto=validate

# Flyway Database Migrations
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.baseline-description=Hibernate Auto-Generated Schema

# Spring Boot Actuator (Observability)
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# JWT Configuration (Secret Key is 256-bit Hex)
jwt.secret=${JWT_SECRET}
# 24 hours in milliseconds
jwt.expiration=86400000

# Redis Configuration
spring.data.redis.url=${REDIS_URL:}
server.forward-headers-strategy=framework
